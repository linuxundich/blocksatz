[workspace]
members = ["crates/gutenberg"]
resolver = "2"

[package]
name = "blocksatz"
version = "0.64.0"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "blocksatz"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_22"] }
gdk-pixbuf = "0.22"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
sourceview5 = { version = "0.11", features = ["v5_4", "gtk_v4_10"] }
webkit6 = "0.6"
pulldown-cmark = "0.13"
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
ureq = { version = "3", features = ["json"] }
serde_json = "1"
base64 = "0.23"
sha2 = "0.10"
futures-lite = "2"
libspelling = "0.5"
gutenberg = { path = "crates/gutenberg" }
webp = { version = "0.3.1", default-features = false }
htmd = "0.5.5"
